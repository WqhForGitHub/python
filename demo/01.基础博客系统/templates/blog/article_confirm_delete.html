{% extends "base.html" %}

{% block title %}删除文章{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-body">
                <h4 class="card-title text-danger">确认删除</h4>
                <p class="card-text">
                    确定要删除文章 <strong>"{{ article.title }}"</strong> 吗？<br>
                    该操作不可撤销，文章的所有评论也会一并删除。
                </p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">确认删除</button>
                    <a href="{% url 'blog:article_detail' article.pk %}" class="btn btn-outline-secondary">取消</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
