{% extends 'base.html' %}

{% block title %}修改密码 · 用户管理系统{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mt-3 mb-3">
    <h2><i class="bi bi-key"></i> 修改密码</h2>
    <a href="{% url 'users:profile' %}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> 返回</a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
                        {% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
                    </div>
                    {% endfor %}
                    <div class="d-grid">
                        <button type="submit" class="btn btn-warning"><i class="bi bi-check-circle"></i> 确认修改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
