{% extends 'base.html' %}

{% block title %}删除用户 · {{ user_obj.username }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-lg-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <i class="bi bi-exclamation-triangle"></i> 确认删除用户
            </div>
            <div class="card-body">
                <p class="fs-5">
                    你即将删除用户 <strong class="text-danger">{{ user_obj.username }}</strong>（{{ user_obj.email }}）。
                </p>
                <p class="text-muted">此操作不可恢复，该用户的所有关联数据将被一并删除。</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> 确认删除</button>
                        <a href="{% url 'users:user_list' %}" class="btn btn-outline-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
