<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>FastAPI 聊天 Demo</title>
<style>
  body { font-family: sans-serif; max-width: 720px; margin: 20px auto; }
  #log { height: 360px; overflow-y: auto; border: 1px solid #ccc; padding: 8px; background: #fafafa; }
  .msg { margin: 4px 0; }
  .sys { color: #888; font-style: italic; }
  .mine { color: #059; }
  .row { margin-top: 8px; display: flex; gap: 8px; }
  input, button { padding: 6px; }
  #content { flex: 1; }
</style>
</head>
<body>
<h2>FastAPI 即时聊天 Demo</h2>
<div class="row">
  <label>我的 ID: <input id="uid" value="1" style="width:60px" /></label>
  <label>房间: <input id="room" value="general" style="width:120px" /></label>
  <label>私聊给: <input id="to" placeholder="(留空=群聊)" style="width:80px" /></label>
  <button id="connect">连接</button>
  <button id="join">加入房间</button>
</div>
<div id="log" style="margin-top:12px"></div>
<div class="row">
  <input id="content" placeholder="输入消息后回车发送..." />
  <button id="send">发送</button>
</div>

<script>
let ws = null;
const log = document.getElementById('log');
function add(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + (cls || '');
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function connect() {
  const uid = document.getElementById('uid').value;
  ws = new WebSocket(`ws://${location.host}/ws/chat?user_id=${uid}`);
  ws.onopen = () => add('-- 已连接 --', 'sys');
  ws.onclose = () => add('-- 已断开 --', 'sys');
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'system') { add(`[系统] ${m.content}`, 'sys'); return; }
    if (m.type === 'heartbeat') return;
    const who = m.from || '?';
    const tag = m.to ? `[私聊 ${who}->${m.to}]` : `[${m.room}] ${who}`;
    add(`${tag}: ${m.content}`, String(m.from) === document.getElementById('uid').value ? 'mine' : '');
  };
}

document.getElementById('connect').onclick = connect;
document.getElementById('join').onclick = () => {
  if (!ws) return alert('请先连接');
  ws.send(JSON.stringify({type: 'join', room: document.getElementById('room').value}));
};
function send() {
  if (!ws) return alert('请先连接');
  const content = document.getElementById('content').value;
  if (!content) return;
  const to = document.getElementById('to').value;
  if (to) {
    ws.send(JSON.stringify({type: 'chat', to: Number(to), content}));
  } else {
    ws.send(JSON.stringify({type: 'chat', room: document.getElementById('room').value, content}));
  }
  document.getElementById('content').value = '';
}
document.getElementById('send').onclick = send;
document.getElementById('content').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
setInterval(() => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({type: 'heartbeat'})); }, 25000);
</script>
</body>
</html>
