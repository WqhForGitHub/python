{% extends "base.html" %}

{% block title %}删除部门 - 企业后台管理系统{% endblock %}
{% block page_title %}删除部门{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <i class="bi bi-exclamation-triangle"></i> 确认删除
                </div>
                <div class="card-body">
                    <p>您确定要删除部门「<strong>{{ department.name }}</strong>」吗？</p>
                    <p class="text-muted">该操作不可恢复，部门下共有 {{ department.employees.count }} 名员工记录。</p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'employees:department_detail' department.pk %}" class="btn btn-outline-secondary">取消</a>
                            <button type="submit" class="btn btn-danger">确认删除</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
