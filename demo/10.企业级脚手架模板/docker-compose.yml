services:
  # ------------------------------------------------------------
  # PostgreSQL
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: scaffold
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d scaffold"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------
  # Redis
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------
  # FastAPI 应用
  # ------------------------------------------------------------
  api:
    build: .
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/scaffold
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: production-please-change-this-long-random-secret
      INITIAL_ADMIN_USERNAME: admin
      INITIAL_ADMIN_PASSWORD: Admin123456
      INITIAL_ADMIN_EMAIL: admin@example.com
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
