{% extends 'base.html' %}

{% block title %}登录 - 电商购物基础系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm mt-5">
            <div class="card-body p-4">
                <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right"></i> 用户登录</h3>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-control" autofocus
                               autocomplete="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" name="password" class="form-control"
                               autocomplete="current-password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right"></i> 登录
                        </button>
                    </div>
                </form>

                <hr>
                <div class="text-center">
                    <span class="text-muted">还没有账号？</span>
                    <a href="{% url 'accounts:register' %}" class="text-decoration-none">立即注册</a>
                </div>

                {% if form.errors %}
                <div class="alert alert-danger mt-3">
                    <i class="bi bi-exclamation-triangle"></i> 用户名或密码错误，请重试。
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
