{% extends 'base.html' %}

{% block title %}注册 - 电商购物基础系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h3 class="text-center mb-4"><i class="bi bi-person-plus"></i> 用户注册</h3>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle"></i> 注册
                        </button>
                    </div>
                </form>

                <hr>
                <div class="text-center">
                    <span class="text-muted">已有账号？</span>
                    <a href="{% url 'accounts:login' %}" class="text-decoration-none">去登录</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
