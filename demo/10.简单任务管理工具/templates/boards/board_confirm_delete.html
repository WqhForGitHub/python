{% extends 'base.html' %}

{% block title %}删除看板 - 简单任务管理工具{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <i class="bi bi-exclamation-triangle"></i> 确认删除
            </div>
            <div class="card-body">
                <h5 class="card-title">确定要删除看板「{{ object.title }}」吗？</h5>
                <p class="card-text text-muted">
                    此操作将永久删除该看板及其下所有列表与卡片，且无法撤销。
                </p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> 确认删除
                    </button>
                    <a href="{% url 'boards:board_detail' pk=object.pk %}" class="btn btn-outline-secondary">取消</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
