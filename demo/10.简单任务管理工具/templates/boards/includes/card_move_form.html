{# 卡片移动下拉表单 #}
<form method="post" action="{% url 'boards:card_move' pk=card.pk %}" class="d-inline card-move-form">
    {% csrf_token %}
    <div class="input-group input-group-sm">
        <select class="form-select form-select-sm" name="target_column_id" onchange="this.form.submit()">
            <option value="" disabled selected>移动到...</option>
            {% for column in board.columns.all %}
                {% if column.pk != card.column.pk %}
                    <option value="{{ column.pk }}">{{ column.title }}</option>
                {% endif %}
            {% endfor %}
        </select>
        <input type="number" name="new_order" value="0" class="form-control form-control-sm" style="max-width: 60px;" title="顺序">
    </div>
</form>
